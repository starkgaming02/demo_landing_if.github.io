<section id="lead-form" class="py-16 bg-gray-100 dark:bg-gray-800 scroll-mt-24">
  <div class="container mx-auto px-4 lg:px-8">
    <div class="bg-surface-light dark:bg-surface-dark rounded-3xl shadow-xl overflow-hidden p-6 lg:p-10 flex flex-col lg:flex-row gap-10">
      <div class="lg:w-1/2 flex flex-col gap-5">
        <div>
          <h2 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white">Resuelve tus dudas</h2>
          <p class="text-sm text-secondary-text-light dark:text-secondary-text-dark mt-1">Escribe tu duda o sugerencia, en breve te atenderemos.</p>
        </div>

        <div class="flex flex-col gap-4">
          <input class="w-full bg-background-light dark:bg-gray-700 border-0 rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary dark:text-white" placeholder="Nombre" type="text" />
          <input class="w-full bg-background-light dark:bg-gray-700 border-0 rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary dark:text-white" placeholder="Teléfono" type="tel" />
          <input class="w-full bg-background-light dark:bg-gray-700 border-0 rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary dark:text-white" placeholder="Email" type="email" />
          <textarea class="w-full bg-background-light dark:bg-gray-700 border-0 rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary dark:text-white" placeholder="Quiero más información, contáctenme." rows="4"></textarea>
        </div>

        <button type="button" class="w-full bg-gray-700 hover:bg-gray-900 dark:bg-gray-600 dark:hover:bg-gray-500 text-white font-bold py-4 rounded-lg flex items-center justify-center gap-2 transition-colors mt-2">
          Enviar
          <span class="material-icons">chevron_right</span>
        </button>
      </div>

      <div class="lg:w-1/2 flex items-center justify-center">
        <div class="w-full max-w-[280px] aspect-[9/16] rounded-xl overflow-hidden shadow-lg bg-black">
          <iframe
            class="w-full h-full"
            src="https://www.youtube.com/embed/e3_hzDpzKJI"
            title="Video de Instituto Fleming en YouTube Shorts"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </div>
  </div>
</section>
